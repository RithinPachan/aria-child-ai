[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-memory"
version = "1.0.0"
description = "ARIA Memory Service — session, profile, and episodic memory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "redis[hiredis]>=5.2.0,<6.0.0",
  "google-cloud-firestore>=2.19.0,<3.0.0",
  "google-cloud-aiplatform>=1.75.0,<2.0.0",
  "google-cloud-logging>=3.11.0,<4.0.0",
  "structlog>=24.4.0,<25.0.0",
  "tenacity>=9.0.0,<10.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0",
  "mypy>=1.14.0,<3.0.0",
  "types-redis>=4.6.0"
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "RET", "SIM"]
lint.ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
