name: Promote Service to Production

on:
  workflow_dispatch:
    inputs:
      component:
        description: Service to promote
        type: choice
        required: true
        options: [gateway, memory, guardrails]
      image_tag:
        description: Immutable staging image tag (normally the validated full Git SHA)
        required: true
        type: string
      release_version:
        description: Semantic release version, for example 1.2.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

# The production GitHub Environment must be protected with required reviewer approval.
concurrency:
  group: production-${{ inputs.component }}
  cancel-in-progress: false

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  AR_REPOSITORY: aria

jobs:
  promote:
    name: Promote ${{ inputs.component }} ${{ inputs.release_version }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version
        run: |
          if ! [[ "${{ inputs.release_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must be semantic version MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify that the immutable image exists
        id: image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPOSITORY}/aria-${{ inputs.component }}:${{ inputs.image_tag }}"
          gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)'
          echo "ref=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy approved image to Cloud Run production
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: aria-${{ inputs.component }}
          image: ${{ steps.image.outputs.ref }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --port=8080
            --service-account=aria-${{ inputs.component }}-production@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --min-instances=1
            --max-instances=30
            --cpu=1
            --memory=1Gi
            --concurrency=80
            --timeout=300
            --no-allow-unauthenticated

      - name: Permit external access to the JWT-protected Gateway only
        if: inputs.component == 'gateway'
        run: |
          gcloud run services add-iam-policy-binding aria-gateway \
            --region "${GCP_REGION}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

      - name: Verify Cloud Run readiness
        env:
          SERVICE: aria-${{ inputs.component }}
        run: |
          gcloud run services describe "$SERVICE" \
            --region "${GCP_REGION}" \
            --format='value(status.conditions[0].status)' | grep -qx True

      - name: Create immutable Git release tag
        env:
          TAG: ${{ inputs.component }}/v${{ inputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "${{ inputs.component }} ${{ inputs.release_version }}"
          git push origin "$TAG"

      - name: Write release summary
        run: |
          {
            echo "## Production promotion complete"
            echo ""
            echo "- Component: **${{ inputs.component }}**"
            echo "- Release: **${{ inputs.release_version }}**"
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Service URL: \`${{ steps.deploy.outputs.url }}\`"
            echo "- Rollback: redeploy the previous immutable image tag through this same workflow."
          } >> "$GITHUB_STEP_SUMMARY"
