name: Build Edge Runtime Artifact

on:
  push:
    branches: [main]
    paths:
      - 'packages/hal/**'
      - 'packages/aria-sdk/**'
      - 'deployment/components.yaml'
      - '.github/workflows/edge-artifact.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: Device artifact channel
        required: true
        type: choice
        options: [canary, stable]

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: edge-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package edge runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check the hardware abstraction layer
        run: pnpm --filter @aria/hal run type-check
      - name: Create a content-addressed source artifact
        run: |
          mkdir -p dist
          tar --sort=name \
              --mtime='UTC 2026-01-01' \
              --owner=0 --group=0 --numeric-owner \
              -czf "dist/aria-edge-runtime-${GITHUB_SHA}.tar.gz" \
              packages/hal packages/aria-sdk deployment/components.yaml
          sha256sum "dist/aria-edge-runtime-${GITHUB_SHA}.tar.gz" \
            | tee "dist/aria-edge-runtime-${GITHUB_SHA}.sha256"
      - name: Upload edge runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-edge-runtime-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/aria-edge-runtime-${{ github.sha }}.tar.gz
      - name: Add artifact details to the workflow summary
        run: |
          {
            echo "## ARIA edge runtime artifact"
            echo ""
            echo "This artifact is **not** automatically pushed to child devices."
            echo "It is a validated, content-addressed input for the later device-management rollout."
            echo ""
            cat "dist/aria-edge-runtime-${GITHUB_SHA}.sha256"
          } >> "$GITHUB_STEP_SUMMARY"
