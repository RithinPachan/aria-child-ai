name: Mobile Delivery

on:
  push:
    branches: [main]
    paths:
      - 'apps/aria-face-app/**'
      - 'apps/parent-dashboard/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-delivery.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Mobile app to build
        required: true
        type: choice
        options: [aria-face-app, parent-dashboard]
      profile:
        description: EAS build profile
        required: true
        type: choice
        options: [preview, production]
      platform:
        description: Target platform
        required: true
        type: choice
        options: [all, android, ios]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.inputs.app || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      face: ${{ steps.filter.outputs.face }}
      parent: ${{ steps.filter.outputs.parent }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            face:
              - 'apps/aria-face-app/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            parent:
              - 'apps/parent-dashboard/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  preview-update:
    name: Publish preview update for ${{ matrix.app }}
    needs: changes
    if: >-
      github.event_name == 'push' &&
      ((matrix.app == 'aria-face-app' && needs.changes.outputs.face == 'true') ||
      (matrix.app == 'parent-dashboard' && needs.changes.outputs.parent == 'true'))
    strategy:
      fail-fast: false
      matrix:
        app: [aria-face-app, parent-dashboard]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up Expo and publish preview update
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GATEWAY_URL: ${{ vars.EXPO_STAGING_GATEWAY_URL }}
        run: |
          npx eas-cli@latest update \
            --branch preview \
            --message "${{ matrix.app }} staging update ${GITHUB_SHA}" \
            --non-interactive

  production-build:
    name: Build ${{ inputs.app }} for production distribution
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Request signed production build
        working-directory: apps/${{ inputs.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GATEWAY_URL: ${{ vars.EXPO_PRODUCTION_GATEWAY_URL }}
        run: |
          npx eas-cli@latest build \
            --platform ${{ inputs.platform }} \
            --profile production \
            --non-interactive \
            --no-wait

  internal-build:
    name: Build internal tester artifact
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'preview'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Request signed internal distribution build
        working-directory: apps/${{ inputs.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GATEWAY_URL: ${{ vars.EXPO_STAGING_GATEWAY_URL }}
        run: |
          npx eas-cli@latest build \
            --platform ${{ inputs.platform }} \
            --profile preview \
            --non-interactive \
            --no-wait
